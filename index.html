<!DOCTYPE html>
<html lang="ar">
<head>
    <!-- Modern AI Chat UI -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <h1>AI Chat</h1>
    </header>

    <!-- منطقة المحادثة -->
    <main>
        <div class="welcome">
            <h2>كيف يمكنني مساعدتك؟</h2>
            <p>اكتب سؤالك أو اختر من الاقتراحات أدناه</p>
        </div>
    </main>

    <!-- صندوق الكتابة -->
    <footer>
        <input type="text" placeholder="اكتب رسالتك هنا...">
        <button id="send-btn">إرسال ↑</button>
    </footer>

    <!-- أزرار الاقتراحات -->
    <div class="suggestions">
        <button class="suggestion-btn">💡 ما هو الذكاء الاصطناعي؟</button>
        <button class="suggestion-btn">🚀 كيف أتعلم البرمجة؟</button>
        <button class="suggestion-btn">🌍 ما هي أفضل لغة برمجة؟</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
